<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Telegram канал</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }
    .post {
      border-bottom: 1px solid #ddd;
      padding: 20px 0;
    }
    h2 { margin-bottom: 5px; }
    .date { color: gray; font-size: 12px; }
  </style>
</head>
<body>

<h1>Последние посты</h1>
<div id="feed">Загрузка...</div>

<script>
async function loadFeed() {
  const rssUrl = "https://rsshub.app/telegram/channel/your_channel";

  const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(rssUrl);

  const res = await fetch(proxyUrl);
  const text = await res.text();

  const parser = new DOMParser();
  const xml = parser.parseFromString(text, "text/xml");

  const items = xml.querySelectorAll("item");

  let html = "";

  if (!items.length) {
    document.getElementById("feed").innerHTML =
      "❌ Нет данных. Проверь RSS ссылку";
    return;
  }

  items.forEach((item, i) => {
    if (i < 10) {
      const title = item.querySelector("title")?.textContent || "";
      const link = item.querySelector("link")?.textContent || "";
      const desc = item.querySelector("description")?.textContent || "";
      const date = item.querySelector("pubDate")?.textContent || "";

      html += `
        <div class="post">
          <h2>${title}</h2>
          <div style="color:gray;font-size:12px">${date}</div>
          <div>${desc}</div>
          <a href="${link}" target="_blank">Открыть</a>
        </div>
      `;
    }
  });

  document.getElementById("feed").innerHTML = html;
}

loadFeed();
</script>

</body>
</html>
